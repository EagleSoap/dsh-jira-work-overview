## 推 tag 即发布到 npm：npm 通过 OIDC 信任本 workflow，不需要任何 token，也不需要两步验证码。
## 绑定信息（一次性）：npmjs.com → 包 → Settings → Trusted publishing
##   Publisher: GitHub Actions · Organization: EagleSoap · Repository: dsh-jira-work-overview
##   Workflow filename: publish.yml · Environment name: 留空 · Allowed actions: Allow npm publish
##
## 改这个文件时别破坏：
##   - 文件名必须与 npm 侧「Workflow filename」逐字符一致：publish.yml
##   - id-token: write 是 OIDC 的唯一硬要求，删掉就退化成需要 token
##   - 不要设 registry-url / NODE_AUTH_TOKEN：空的 token 会挡住 OIDC 发布
##   - 不要设 NPM_CONFIG_PROVENANCE=false：公开仓库自动带 provenance
##   - 发布用 npm@11（>= 11.5.1 才支持 OIDC）；npm@12 的 --provenance 是坏的
##   - 本插件零构建、无依赖、无 lockfile：不要加 npm ci / npm install
##   - 验证步骤必须轮询：npm publish 返回后包还在 processing，几秒内 registry 对版本 URL 回 404
name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  id-token: write # OIDC：npm 据此确认「是本人授权的 workflow」
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      npm_config_registry: 'https://registry.npmjs.org'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          # 不要加 registry-url：它会写一个空的 NODE_AUTH_TOKEN，挡住 OIDC

      - name: Upgrade npm (OIDC needs >= 11.5.1)
        run: |
          npm install -g npm@11
          node --version
          npm --version

      - name: Verify the tag matches package.json
        # 只在 tag 推送时校验；手动触发时 GITHUB_REF_NAME 是分支名，比了必然不等
        if: github.event_name == 'push'
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "package.json=$PKG_VERSION  tag=$TAG_VERSION"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Preflight — release content must be self-consistent
        # 只读检查：version / CHANGELOG 定稿 / [Unreleased] 已清空 / bundle 身份 / 脱敏 / pack 清单。
        # 任何一项不对就在这里失败，绝不进入 npm publish。纯 Node + npm + git，不需要装任何依赖。
        # （离线测试套件由 test.yml 在同一个提交 push 到 main 时跑过；tag 打在绿过的提交上。）
        run: node test/dsh-jira-release.mjs --release

      - name: Pack (the tarball we must see on the registry)
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          ls -l "$RUNNER_TEMP"

      - name: Publish to npm
        # 版本已在 registry 上（重跑、或 tag 打在了已发布的提交上）就不再发：npm 会报
        # "cannot publish over the previously published versions"，而这并不代表这次构建有问题。
        run: |
          PKG="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          if curl -fsS "https://registry.npmjs.org/$PKG/$VERSION" 2>/dev/null >/dev/null; then
            echo "::notice::$PKG@$VERSION is already on the registry — skipping npm publish"
            exit 0
          fi
          npm publish --access public

      - name: Verify the registry actually serves this version
        # 发布"看起来成功"什么都证明不了：版本上线、latest 指向它、shasum 与本地打包一致才算数。
        # npm 的 `publish` 返回 "+ pkg@x.y.z" 只代表收下了：包还在 processing，几秒内 registry 会对
        # 这个版本回 404（v0.16.0 就是 1.6s 后去查，E404 把整个 run 标红，而包其实上线了）。
        # 所以这里轮询等它出现（最多 ~2 分钟），并用 curl 直接读 registry 文档——`npm view` 会撞旧缓存。
        run: |
          set -uo pipefail
          PKG="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          LOCAL_SHASUM="$(node -e '
            const { createHash } = require("node:crypto")
            const { readFileSync, readdirSync } = require("node:fs")
            const dir = process.argv[1]
            const f = readdirSync(dir).find(n => n.endsWith(".tgz"))
            console.log(createHash("sha1").update(readFileSync(require("node:path").join(dir, f))).digest("hex"))
          ' "$RUNNER_TEMP")"
          META=""
          # npm answers "Your package is being processed and may take a few minutes to become available":
          # on 0.16.1 the version metadata appeared ~2 min after the upload and the tarball a few minutes
          # later, which is why this waits up to 5 minutes instead of 2 (the 0.16.1 run went red only
          # because the publish itself outlived the 120 s window, not because anything was wrong).
          for attempt in $(seq 1 60); do
            META="$(curl -fsS "https://registry.npmjs.org/$PKG/$VERSION" 2>/dev/null || true)"
            if [ -n "$META" ]; then
              echo "registry serves $PKG@$VERSION (attempt $attempt)"
              break
            fi
            echo "attempt $attempt: $PKG@$VERSION not served yet (still processing), waiting 5s"
            sleep 5
          done
          if [ -z "$META" ]; then
            echo "::error::$PKG@$VERSION is still not on the registry after $((attempt * 5))s of polling"
            exit 1
          fi
          echo "::group::dist of $PKG@$VERSION"
          node -e 'const j = JSON.parse(process.argv[1]); console.log(JSON.stringify({ shasum: j.dist.shasum, integrity: j.dist.integrity, fileCount: j.dist.fileCount, unpackedSize: j.dist.unpackedSize }, null, 2))' "$META"
          REG_SHASUM="$(node -p 'JSON.parse(process.argv[1]).dist.shasum' "$META")"
          echo "registry=$REG_SHASUM  local=$LOCAL_SHASUM"
          echo "::endgroup::"
          if [ "$REG_SHASUM" != "$LOCAL_SHASUM" ]; then
            echo "::error::shasum mismatch — the registry is not serving the tarball we packed"
            exit 1
          fi
          # dist-tag 只在包文档（不带版本号的那个 URL）里有，latest 指到新版本才算发布完成。
          # 包文档比单版本文档刷得晚：0.16.5 时版本已上线、tarball 已与本地一致，但同一秒读包文档
          # 的 dist-tags.latest 还是上一版 —— 旧版这里只读一次就 exit 1，把一次完全正常的发布标红。
          # 现在同样轮询（最多 2 分钟）：latest 追上来才算完成。
          LATEST=""
          for attempt in $(seq 1 24); do
            PACKUMENT="$(curl -fsS "https://registry.npmjs.org/$PKG" || true)"
            LATEST="$(node -e 'try { console.log(JSON.parse(process.argv[1])["dist-tags"].latest) } catch { console.log("") }' "$PACKUMENT")"
            if [ "$LATEST" = "$VERSION" ]; then
              echo "dist-tags.latest=$LATEST (attempt $attempt)"
              break
            fi
            echo "attempt $attempt: dist-tags.latest=${LATEST:-<unreadable>}, waiting 5s"
            sleep 5
          done
          if [ "$LATEST" != "$VERSION" ]; then
            echo "::error::dist-tags.latest is ${LATEST:-<unreadable>}, expected $VERSION"
            exit 1
          fi
